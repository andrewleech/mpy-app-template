[project]
name = "mpy-app-template"
version = "0.1.0"
description = "Copier template for MicroPython application projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "copier>=9.4",
    "mpbuild>=1.0",
]

[project.scripts]
mpy-new-project = "mpy_app_template.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mpy_app_template"]
