[project]
name = "mpy-app-template"
description = "Copier template for MicroPython application projects"
readme = "README.md"
requires-python = ">=3.12"  # mpbuild requires 3.12
dynamic = ["version"]
dependencies = [
    "copier>=9.4",
    "mpbuild>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
mpy-new-project = "mpy_app_template.cli:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mpy_app_template"]

[tool.setuptools_scm]
# Version comes from git tags, so releases need no edit here. Until the first
# tag exists the fallback keeps builds working.
fallback_version = "0.0.0"
