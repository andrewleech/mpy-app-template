# CONFIGURATION
_subdirectory: template
_min_copier_version: 9.0.0
_templates_suffix: .tmpl

_message_before_copy: |

  MicroPython application project template.

  You will be asked a series of questions to configure your new project.
  Press ENTER to accept the default shown, or type your own value.

_envops:
  autoescape: false
  block_end_string: "%]"
  block_start_string: "[%"
  comment_end_string: "#]"
  comment_start_string: "[#"
  keep_trailing_newline: true
  variable_end_string: "]]"
  variable_start_string: "[["

# SCRIPTS
# initial_setup.py registers submodules, copies the board definition, resolves
# the build containers from mpbuild and installs type stubs. It is re-runnable;
# `make setup` invokes it again after a MicroPython bump.
_tasks:
  - "[[ _copier_python ]] tools/initial_setup.py"

_ci:
  type: bool
  help: Set to true when running the template's own CI job.
  default: false

# PROJECT

project_name:
  type: str
  help: Project name, used in paths and device identification. Should not contain spaces.
  default: "MyProject"

project_url:
  type: str
  help: Git remote URL for the project repository.
  default: "git@github.com:user/[[ project_name.lower() ]].git"

author:
  type: str
  help: Copyright holder, written into source headers and LICENSE.
  default: ""

license:
  type: str
  help: Project licence. "none" omits the LICENSE file and source headers.
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - none
  default: MIT

# TARGET

target_port:
  type: str
  help: MicroPython port for your hardware. These are the ports mpbuild can build in a container.
  # Regenerate with tools/sync_mpbuild.py; CI fails if this drifts from mpbuild.
  choices:
  # BEGIN ports generated by tools/sync_mpbuild.py
  # mpbuild 1.2.0
    - baochip
    - esp32
    - esp8266
    - mimxrt
    - nrf
    - psoc-edge
    - psoc6
    - renesas-ra
    - rp2
    - samd
    - stm32
    - unix
  # END ports generated by tools/sync_mpbuild.py
  default: stm32

