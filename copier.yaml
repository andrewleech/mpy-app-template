# CONFIGURATION
_subdirectory: template
_min_copier_version: 9.0.0
_templates_suffix: .tmpl

_message_before_copy: |

  MicroPython application project template.

  You will be asked a series of questions to configure your new project.
  Press ENTER to accept the default shown, or type your own value.

_envops:
  autoescape: false
  block_end_string: "%]"
  block_start_string: "[%"
  comment_end_string: "#]"
  comment_start_string: "[#"
  keep_trailing_newline: true
  variable_end_string: "]]"
  variable_start_string: "[["

# SCRIPTS
# initial_setup.py registers submodules, copies the board definition, resolves
# the build containers from mpbuild and installs type stubs. It is re-runnable;
# `make setup` invokes it again after a MicroPython bump.
# Supplies the port and board lookups the questions below call into. Copier
# imports extensions from its own environment, which is why generation goes
# through the mpy-new command (see README).
_jinja_extensions:
  - mpy_app_template.boards.MicroPythonExtension

_tasks:
  - "[[ _copier_python ]] tools/initial_setup.py"

_ci:
  type: bool
  help: Set to true when running the template's own CI job.
  default: false

# PROJECT

project_name:
  type: str
  help: Project name, used in paths and device identification. Should not contain spaces.
  default: "MyProject"

project_url:
  type: str
  help: Git remote URL for the project repository.
  default: "git@github.com:user/[[ project_name.lower() ]].git"

author:
  type: str
  help: Copyright holder, written into source headers and LICENSE.
  default: ""

license:
  type: str
  help: Project licence. "none" omits the LICENSE file and source headers.
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - none
  default: MIT

# TARGET

target_port:
  type: str
  help: MicroPython port for your hardware, from the ports mpbuild builds in a container.
  choices: "[[ mpbuild_ports() ]]"
  default: stm32

template_board:
  type: str
  help: Board to start from, chosen from the ones this port offers.
  when: "[[ target_port != 'unix' ]]"
  choices: "[[ boards_for(target_port) ]]"
  validator: >-
    [% if not template_board %]The [[ target_port ]] port has no board
    definitions in MicroPython, so there is nothing to start from.[% endif %]
  default: >-
    [[ {'stm32': 'PYBV11', 'rp2': 'RPI_PICO', 'esp32': 'ESP32_GENERIC',
        'esp8266': 'ESP8266_GENERIC', 'mimxrt': 'TEENSY40', 'samd':
        'ADAFRUIT_ITSYBITSY_M4_EXPRESS', 'nrf': 'PCA10056', 'renesas-ra':
        'EK_RA6M2'}.get(target_port, (boards_for(target_port) or [''])[0]) ]]

project_board_name:
  type: str
  help: Name for the project's copy of the board definition (uppercase).
  when: "[[ target_port != 'unix' ]]"
  # Copier evaluates a default even for a skipped question, so this has to
  # collapse to empty rather than leaving a dangling "PROJECT_" name behind.
  default: "[% if target_port != 'unix' %][[ project_name.upper() ]]_[[ template_board ]][% endif %]"

# BOOTLOADER

use_mboot:
  type: bool
  help: Use the mboot bootloader? Regular mboot only; signing and encryption are not supported.
  when: "[[ target_port == 'stm32' ]]"
  default: false

bootloader_address:
  type: str
  help: Address of the bootloader in flash, needed for the version footer.
  when: "[[ target_port == 'stm32' and use_mboot ]]"
  default: "0x08000000"

# PROJECT SETTINGS

version_scheme:
  type: str
  help: |
    How the version number is derived.
       * git-versioner computes the "next" version and provides release tooling.
       * git-describe uses the previous tag plus commits since.
  choices:
    - git-versioner
    - git-describe
  default: git-versioner

ci_platform:
  type: str
  help: Which CI configuration to generate.
  choices:
    - github
    - gitlab
    - both
  default: github
